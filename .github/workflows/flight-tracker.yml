name: Flight tracker (SIN-BKK weekends)

on:
  schedule:
    # Off the hour to avoid GitHub's top-of-hour scheduling backlog.
    # Daily at 09:17 Singapore time: the next 12 weekends (~24 searches).
    - cron: "17 1 * * *"
    # Wednesdays at 10:47 Singapore time: every on-sale 2027 weekend (up to
    # ~106 searches). If you change this line, change WEEKLY_CRON below too.
    - cron: "47 2 * * 3"
  workflow_dispatch:
    inputs:
      scan:
        description: Which weekends to check
        type: choice
        options: [upcoming, year2027]
        default: upcoming

permissions:
  contents: write

env:
  WEEKLY_CRON: "47 2 * * 3"

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flight-tracker/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Fetch fares
        id: track
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_DEBUG_DIR: debug-pages
          SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.scan || (github.event.schedule == env.WEEKLY_CRON && 'year2027' || 'upcoming') }}
        run: |
          set +e
          echo "scan=$SCAN" >> "$GITHUB_OUTPUT"
          python -m tracker config.toml --scan "$SCAN"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Pages that failed to parse or had unreadable results, for diagnosis.
      # Kept as a run artifact for 7 days; never committed.
      - name: Upload pages that could not be read
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-pages
          path: flight-tracker/debug-pages/
          if-no-files-found: ignore
          retention-days: 7

      # Commit even when fetches failed, so the history and summary record
      # the failure instead of silently showing yesterday's prices.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv SUMMARY*.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "flight-tracker: update ${{ steps.track.outputs.scan }} fares $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Fail if every fetch failed
        if: steps.track.outputs.code != '0'
        run: |
          echo "::error::All fare lookups failed this run. See the 'Fetch fares' log and the summary page."
          exit 1
