name: Flight tracker (SIN-BKK weekends)

on:
  schedule:
    # 01:17 UTC = 09:17 Singapore time, once a day. Off the hour to avoid
    # GitHub's top-of-hour scheduling backlog.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flight-tracker/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Fetch fares
        id: track
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -m tracker config.toml
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Commit even when fetches failed, so the history and summary record
      # the failure instead of silently showing yesterday's prices.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv SUMMARY.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "flight-tracker: update fares $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Fail if every fetch failed
        if: steps.track.outputs.code != '0'
        run: |
          echo "::error::All fare lookups failed this run. See the 'Fetch fares' log and SUMMARY.md."
          exit 1
